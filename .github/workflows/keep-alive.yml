# Free Supabase projects pause after about a week with nobody using them, which would stop invites,
# sync and public wiki links. This asks the database one tiny question twice a week so it stays awake.
# The address and key are the app's public ones (the same ones in src/cloud/client.ts).
name: Keep the cloud awake

on:
  schedule:
    - cron: '17 3 * * 1,4'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: https://ysrxumagiiaoihlhofqt.supabase.co
          KEY: sb_publishable_HsmvijuCGe53E9WU5N2ZQA_1EGPpGt1
        run: |
          curl --fail-with-body -sS -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
