# Checks every change builds, and publishes the web version to GitHub Pages from main.
name: Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The example world's Markdown files (worlds/vael-ardith). The build checks them too; this step shows the report on its own.
      - name: Check the example world
        run: npm run check
      - run: npm run lint
      # The GitHub Pages copy lives in a folder (/ttrpg-campaign-manager/), so it loads files relative to the page.
      - run: npm run build -- --base ./
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
